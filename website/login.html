<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13131a">
  <title>Sign in — AlphaFX</title>
  <link rel="stylesheet" href="css/capiffy/dbe7481feefb38d2.css">
  <link rel="stylesheet" href="css/capiffy/59f9d657f37015b6.css">
  <link rel="stylesheet" href="css/capiffy/c1bee8ab903b382d.css">
  <link rel="stylesheet" href="css/capiffy/3ac04c147fc81d91.css">
  <link rel="stylesheet" href="css/capiffy/3c6a7efccbedf43f.css">
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(255, 215, 0, 0.08), transparent 60%),
        var(--bg, #0a0a0f);
    }
    .login-card {
      width: min(420px, 100%);
      padding: 32px 28px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.03), transparent 55%), var(--card, #141418);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .login-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #1a1505;
      background: linear-gradient(135deg, #ffe45c, gold 45%, #c99a2e);
    }
    .login-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 900;
      margin: 0;
      color: var(--text);
    }
    .login-sub {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-dim);
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .login-field label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-mute);
    }
    .login-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-2, #101014);
      color: var(--text);
      font: inherit;
    }
    .login-field input:focus {
      outline: none;
      border-color: rgba(255, 215, 0, 0.45);
      box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.12);
    }
    .login-error {
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
      font-size: 13px;
    }
    .login-submit {
      width: 100%;
      margin-top: 8px;
      padding: 13px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      color: #1a1505;
      background: linear-gradient(135deg, #ffe45c, gold 45%, #c99a2e);
    }
    .login-note {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-dim);
      text-align: center;
    }
  </style>
</head>
<body data-page="login">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo">A</div>
        <div>
          <h1 class="login-title">AlphaFX</h1>
          <p class="login-sub">Trader portal sign in</p>
        </div>
      </div>

      <div id="login-error" class="login-error" hidden></div>

      <form id="login-form">
        <div class="login-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="login-submit">Sign in</button>
      </form>

      <p class="login-note">Only one active session is allowed. Signing in on another device will sign out the previous session.</p>
      <p class="login-note" style="margin-top:8px;"><a href="register.html" style="color:var(--gold);">Create a new account</a></p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js?v=20260907g"></script>
  <script src="js/auth.js"></script>
</body>
</html>
