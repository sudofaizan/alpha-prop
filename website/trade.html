<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#13131a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade — AlphaFX</title>
  <link rel="stylesheet" href="css/capiffy/dbe7481feefb38d2.css">
  <link rel="stylesheet" href="css/capiffy/59f9d657f37015b6.css">
  <link rel="stylesheet" href="css/capiffy/c1bee8ab903b382d.css">
  <link rel="stylesheet" href="css/capiffy/3ac04c147fc81d91.css">
  <link rel="stylesheet" href="css/capiffy/3c6a7efccbedf43f.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/trade-terminal.css?v=20260908h">
</head>
<body data-page="trade" data-title="Trade" data-no-wrap="true">
  <div id="app-root">
    <div class="trade-terminal">
      <div class="trade-topbar">
        <div class="trade-symbol-tabs" id="trade-symbol-tabs"></div>
        <div class="trade-account-bar" id="trade-account-bar">
          <select id="trade-account-select" class="trade-account-select" aria-label="Trading account"></select>
          <span class="trade-account-balance" id="trade-account-balance">—</span>
        </div>
        <div class="trade-status">
          <span class="trade-status-dot" id="trade-live-dot"></span>
          <span id="trade-live-label">Connecting…</span>
        </div>
      </div>

      <div class="trade-main" id="trade-main">
        <div class="trade-watchlist-panel" id="trade-watchlist-panel">
          <aside class="trade-watchlist" id="trade-watchlist" aria-label="Watchlist"></aside>
          <button
            type="button"
            class="trade-panel-toggle"
            id="trade-watchlist-toggle"
            title="Hide watchlist"
            aria-controls="trade-watchlist"
            aria-expanded="true"
          >
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </button>
        </div>

        <section class="trade-chart-wrap">
          <div class="trade-chart-toolbar">
            <div class="trade-timeframes" id="trade-timeframes" role="tablist" aria-label="Chart timeframe"></div>
          </div>
          <div class="trade-chart-body">
            <div class="trade-chart-badge" id="trade-chart-badge">Loading…</div>
            <div id="trade-chart"></div>
            <div class="trade-pos-overlays" id="trade-pos-overlays" aria-hidden="true"></div>
          </div>
        </section>

        <aside class="trade-ticket">
          <div class="trade-ticket-tabs" id="trade-order-type-tabs">
            <button type="button" class="active" data-type="market">Market</button>
            <button type="button" data-type="limit">Limit</button>
            <button type="button" data-type="stop">Stop</button>
          </div>
          <div class="trade-field" id="trade-price-field" hidden>
            <label for="trade-price">Order price</label>
            <input id="trade-price" type="text" placeholder="Enter price">
          </div>
          <div class="trade-field">
            <label for="trade-volume">Volume (lots)</label>
            <input id="trade-volume" type="number" value="0.01" min="0.01" step="0.01">
          </div>
          <div class="trade-field">
            <label for="trade-sl">Stop loss (optional)</label>
            <input id="trade-sl" type="text" placeholder="—">
          </div>
          <div class="trade-field">
            <label for="trade-tp">Take profit (optional)</label>
            <input id="trade-tp" type="text" placeholder="—">
          </div>
          <div class="trade-actions">
            <button type="button" class="sell" id="trade-sell-btn" disabled>SELL<br><span class="sub" id="trade-sell-px">—</span></button>
            <button type="button" class="buy" id="trade-buy-btn" disabled>BUY<br><span class="sub" id="trade-buy-px">—</span></button>
          </div>
          <div class="trade-metrics" id="trade-metrics">
            <div class="trade-metric-row"><span>Equity</span><span id="trade-equity">—</span></div>
            <div class="trade-metric-row"><span>Balance</span><span id="trade-balance">—</span></div>
            <div class="trade-metric-row"><span>Free margin</span><span id="trade-free-margin">—</span></div>
            <div class="trade-metric-row"><span>Margin used</span><span id="trade-margin-used">—</span></div>
            <div class="trade-metric-row trade-metric-pnl"><span>Unrealised P/L</span><span id="trade-unrealised">—</span></div>
          </div>
        </aside>
      </div>

      <div class="trade-bottom">
        <div class="trade-bottom-tabs" id="trade-bottom-tabs">
          <button type="button" class="active" data-panel="open">Open <span class="trade-tab-count" id="trade-count-open">0</span></button>
          <button type="button" data-panel="pending">Pending <span class="trade-tab-count" id="trade-count-pending">0</span></button>
          <button type="button" data-panel="closed">Closed <span class="trade-tab-count" id="trade-count-closed">0</span></button>
        </div>
        <div class="trade-bottom-body" id="trade-bottom-body"></div>
      </div>

      <!-- MT5-style mobile shell (≤960px) -->
      <div class="mt5-mobile" id="mt5-mobile" hidden>
        <header class="mt5-head">
          <button type="button" class="mt5-symbol-btn" id="mt5-symbol-btn" aria-expanded="false">
            <span class="mt5-symbol-name" id="mt5-symbol-name">—</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button type="button" class="mt5-tf-btn" id="mt5-tf-btn">M1</button>
          <span class="mt5-live-pill"><span class="mt5-live-dot" id="mt5-live-dot"></span><span id="mt5-live-text">Live</span></span>
        </header>

        <div class="mt5-oct">
          <button type="button" class="mt5-oct-side mt5-oct-side--sell" id="mt5-sell-btn" disabled>
            <span class="mt5-oct-label">SELL</span>
            <span class="mt5-oct-price" id="mt5-sell-px">—</span>
          </button>
          <div class="mt5-lot">
            <button type="button" class="mt5-lot-step" id="mt5-lot-minus" aria-label="Decrease volume">−</button>
            <input type="number" class="mt5-lot-input" id="mt5-lot-input" value="0.01" min="0.01" step="0.01" aria-label="Volume">
            <button type="button" class="mt5-lot-step" id="mt5-lot-plus" aria-label="Increase volume">+</button>
          </div>
          <button type="button" class="mt5-oct-side mt5-oct-side--buy" id="mt5-buy-btn" disabled>
            <span class="mt5-oct-label">BUY</span>
            <span class="mt5-oct-price" id="mt5-buy-px">—</span>
          </button>
        </div>

        <div class="mt5-pos-bar" id="mt5-pos-bar" hidden aria-hidden="true">
          <div class="mt5-pos-slider-wrap" id="mt5-pos-slider-wrap">
            <div class="mt5-pos-slider-track" id="mt5-pos-slider-track">
              <button type="button" class="mt5-pos-pane mt5-pos-pane--close" id="mt5-pos-pane-close">
                <span class="mt5-pos-close-icon" aria-hidden="true">→</span>
                <span class="mt5-pos-close-text" id="mt5-pos-close-text">Close buy</span>
                <span class="mt5-pos-close-vol" id="mt5-pos-close-vol">0.01</span>
              </button>
              <button type="button" class="mt5-pos-pane mt5-pos-pane--modify" id="mt5-pos-pane-modify">
                <span class="mt5-pos-close-icon" aria-hidden="true">↔</span>
                <span>Modify position</span>
              </button>
            </div>
          </div>
          <div class="mt5-pos-stops" id="mt5-pos-stops">
            <button type="button" class="mt5-pos-stop mt5-pos-stop--sl" id="mt5-pos-sl" aria-label="Set stop loss">SL</button>
            <button type="button" class="mt5-pos-stop mt5-pos-stop--tp" id="mt5-pos-tp" aria-label="Set take profit">TP</button>
          </div>
          <button type="button" class="mt5-pos-bar-dismiss" id="mt5-pos-bar-dismiss" aria-label="Dismiss">⌃</button>
        </div>

        <nav class="mt5-dock" aria-label="Trade navigation">
          <button type="button" class="mt5-dock-btn" data-mt5-tab="quotes">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            <span>Quotes</span>
          </button>
          <button type="button" class="mt5-dock-btn is-active" data-mt5-tab="chart">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-5 4 4 7-9"/></svg>
            <span>Chart</span>
          </button>
          <button type="button" class="mt5-dock-btn" data-mt5-tab="trade">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
            <span>Trade</span>
          </button>
          <button type="button" class="mt5-dock-btn" data-mt5-tab="history">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span>History</span>
          </button>
          <button type="button" class="mt5-dock-btn" data-mt5-tab="menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <span>Menu</span>
          </button>
        </nav>

        <div class="mt5-sheet" id="mt5-sheet" aria-hidden="true">
          <div class="mt5-sheet-backdrop" id="mt5-sheet-backdrop"></div>
          <div class="mt5-sheet-panel" role="dialog" aria-modal="true">
            <div class="mt5-sheet-handle"></div>
            <header class="mt5-sheet-head">
              <h2 class="mt5-sheet-title" id="mt5-sheet-title">Quotes</h2>
              <button type="button" class="mt5-sheet-close" id="mt5-sheet-close" aria-label="Close">×</button>
            </header>
            <div class="mt5-sheet-body" id="mt5-sheet-body"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="vendor/alphafx-charts.standalone.js"></script>
  <script src="js/layout.js?v=20260907g"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js?v=20260907g"></script>
  <script src="js/auth.js?v=20260907i"></script>
  <script src="js/ws-quotes.js"></script>
  <script src="js/trade-toast.js"></script>
  <script src="js/sim-pnl.js"></script>
  <script src="js/chart-positions.js?v=20260908i"></script>
  <script src="js/trade.js?v=20260908g"></script>
</body>
</html>
