<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#13131a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — AlphaFX</title>
    <link rel="stylesheet" href="css/capiffy/dbe7481feefb38d2.css">
  <link rel="stylesheet" href="css/capiffy/59f9d657f37015b6.css">
  <link rel="stylesheet" href="css/capiffy/c1bee8ab903b382d.css">
  <link rel="stylesheet" href="css/capiffy/3ac04c147fc81d91.css">
  <link rel="stylesheet" href="css/capiffy/3c6a7efccbedf43f.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/challenges-bridge.css">
</head>
<body data-page="support" data-title="Support">
  <div id="app-root">
    <div class="page-top-row">
      <div>
        <span class="badge-pill">HELP</span>
        <div class="page-intro">
          <h2>Support</h2>
          <p>Open a ticket and talk to a human. Average response time is under two hours.</p>
        </div>
      </div>
      <button class="btn-gold-sm" style="margin-top:0">+ New ticket</button>
    </div>

    <div class="support-layout">
      <div class="support-list">
        <input type="text" placeholder="Search tickets...">
        <div class="empty-state" style="padding:2rem 0;background:transparent;border:none">
          <p style="font-size:0.82rem">No tickets yet</p>
        </div>
      </div>
      <div class="support-main">
        <div class="empty-state" style="background:transparent;border:none">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <h3>Select a conversation</h3>
          <p>Choose a ticket from the list to open the thread, or start a new conversation.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="js/layout.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
